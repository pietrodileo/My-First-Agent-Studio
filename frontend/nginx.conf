server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  proxy_connect_timeout 60s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location /api/ {
    proxy_pass http://iris:52773/agent-ui/api/;
    proxy_buffering off;
  }

  location / {
    try_files $uri /index.html;
  }
}
